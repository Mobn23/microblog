- name: Import Flask Exporter dashboard into Grafana
  community.grafana.grafana_dashboard:
    grafana_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ grafana_port }}"
    grafana_user: "{{ grafana_admin_user }}"
    grafana_password: "{{ grafana_admin_password }}"
    state: present
    overwrite: true
    path: "{{ role_path }}/files/flask-exporter-dashboard.json"
  delegate_to: localhost
  become: false

- name: Import Microblog Errors dashboard into Grafana
  community.grafana.grafana_dashboard:
    grafana_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ grafana_port }}"
    grafana_user: "{{ grafana_admin_user }}"
    grafana_password: "{{ grafana_admin_password }}"
    state: present
    overwrite: true
    path: "{{ role_path }}/files/microblog-errors-dashboard.json"
  delegate_to: localhost
  become: false
